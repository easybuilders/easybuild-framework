# configuration for pre-commit (https://pre-commit.com), see CONTRIBUTING.md;
# install the git hook with: pre-commit install
#
# vendored code and test data (where whitespace can be significant) are excluded
exclude: |
  (?x)^(
    easybuild/tools/tomllib/tomli/.*|
    minimal_bash_completion\.bash|
    test/framework/(easyconfigs|easystacks|modules|sandbox)/.*
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # retain trailing double space as line break in Markdown files
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/PyCQA/flake8
    # keep in sync with requirements-lint.txt
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-comprehensions==3.17.0]
