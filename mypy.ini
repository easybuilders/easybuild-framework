[mypy]
# Core settings
python_version = 3.6
warn_return_any = False
warn_unused_configs = True

# Ignore missing imports - EasyBuild uses dynamic imports extensively
ignore_missing_imports = True

# Don't check untyped calls or definitions - we're focusing on existing type hints
# and improving them, not adding them everywhere
check_untyped_defs = False
disallow_untyped_defs = False

# Don't warn about anything related to dynamically created imports/attributes
warn_no_return = False
warn_unreachable = False
strict_optional = False

# Show error codes to identify problems
show_error_codes = True
show_column_numbers = True

# For subclass patterns and inheritance
warn_redundant_casts = True
warn_unused_ignores = True

[mypy-easybuild.*]
# Apply stricter checks to the main codebase
warn_return_any = True

[mypy-test.*]
# Less strict for tests
ignore_errors = True
