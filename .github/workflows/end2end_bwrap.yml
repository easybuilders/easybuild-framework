name: End-to-end test of EasyBuild with bwrap

on: [push, pull_request]

jobs:
  end2end:
    name: End-to-end test (runner VM)
    runs-on: ubuntu-26.04

    steps:
      - name: Check out the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install system packages
        run: sudo apt-get install -y lmod bubblewrap

      - name: Allow unprivileged user namespaces (Ubuntu 26.04)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0

      - name: Download and unpack easyblocks and easyconfigs repositories
        run: |
          cd "$HOME"
          for pkg in easyblocks easyconfigs; do
              curl -OL "https://github.com/easybuilders/easybuild-${pkg}/archive/develop.tar.gz"
              tar xfz develop.tar.gz
              rm -f develop.tar.gz
          done

      - name: Set up environment
        shell: bash
        run: |
          # collect environment variables to be set in subsequent steps in script that can be sourced
          echo "export PATH=$PWD:$PATH" > /tmp/eb_env
          echo "export PYTHONPATH=$PWD:$HOME/easybuild-easyblocks-develop:$HOME/easybuild-easyconfigs-develop" >> /tmp/eb_env

      - name: Run commands to check test environment
        shell: bash
        run: |
          cmds=(
            "whoami"
            "pwd"
            "env | sort"
            "eb --version"
            "eb --show-system-info"
            "eb --check-eb-deps"
            "eb --show-config"
            "eb -x UnZip-6.0.eb"
          )

          for cmd in "${cmds[@]}"; do
              echo ">>> $cmd"
              bash -lc "source /tmp/eb_env; $cmd"
          done

      - name: Define bwrap validation helper
        shell: bash
        run: |
          cat > /tmp/check_bwrap_install.sh <<'EOF'
          #!/usr/bin/env bash

          check_no_glob_matches() {
              local label="$1"
              local pattern="$2"

              echo ">>> CHECK: $label"
              echo "    glob: $pattern"

              if compgen -G "$pattern" > /dev/null; then
                  echo "FAIL: files/directories matched"
                  compgen -G "$pattern" | sort
                  return 1
              fi

              echo "PASS: no files/directories matched"
              echo
          }

          check_path_exists() {
              local label="$1"
              local path="$2"

              echo ">>> CHECK: $label"
              echo "    path: $path"

              if [[ -e "$path" ]]; then
                  echo "PASS: path exists"
                  ls -ld "$path"
                  echo
                  return 0
              fi

              echo "FAIL: path does not exist"
              echo "Parent contents:"
              ls -la "$(dirname "$path")" || true
              echo
              return 1
          }

          check_glob_exists() {
              local label="$1"
              local pattern="$2"

              echo ">>> CHECK: $label"
              echo "    glob: $pattern"

              if compgen -G "$pattern" > /dev/null; then
                  echo "PASS: matches found"
                  compgen -G "$pattern" | sort | xargs -r ls -l
                  echo
                  return 0
              fi

              echo "FAIL: no matches found"
              echo
              return 1
          }

          main() {
              local failures=0

              echo "=== Host-side EasyBuild path state ==="
              find "$HOME/.local/easybuild" -maxdepth 5 -print || true
              echo

              echo "=== bwrap install path state ==="
              find /tmp/bwrap-installpath -maxdepth 5 -print || true
              echo

              check_no_glob_matches "no host UnZip modules" \
                  "$HOME/.local/easybuild/modules/all/UnZip/*" || failures=$((failures + 1))

              check_no_glob_matches "no host bzip2 modules" \
                  "$HOME/.local/easybuild/modules/all/bzip2/*" || failures=$((failures + 1))

              check_no_glob_matches "no host UnZip software files" \
                  "$HOME/.local/easybuild/software/UnZip/6.0/*" || failures=$((failures + 1))

              check_no_glob_matches "no host bzip2 software files" \
                  "$HOME/.local/easybuild/software/bzip2/1.0.8/*" || failures=$((failures + 1))

              check_path_exists "bwrap bzip2 module file exists" \
                  "/tmp/bwrap-installpath/modules/all/bzip2/1.0.8.lua" || failures=$((failures + 1))

              check_path_exists "bwrap UnZip module file exists" \
                  "/tmp/bwrap-installpath/modules/all/UnZip/6.0.lua" || failures=$((failures + 1))

              check_glob_exists "bwrap UnZip installed binaries exist" \
                  "/tmp/bwrap-installpath/software/UnZip/*/bin/*" || failures=$((failures + 1))

              check_glob_exists "bwrap bzip2 installed binaries exist" \
                  "/tmp/bwrap-installpath/software/bzip2/*/bin/*" || failures=$((failures + 1))

              check_glob_exists "bwrap UnZip EasyBuild logs exist" \
                  "/tmp/bwrap-installpath/software/UnZip/*/easybuild/*log*" || failures=$((failures + 1))

              check_glob_exists "bwrap bzip2 EasyBuild logs exist" \
                  "/tmp/bwrap-installpath/software/bzip2/*/easybuild/*log*" || failures=$((failures + 1))

              if [[ "$failures" -ne 0 ]]; then
                  echo "ERROR: $failures bwrap validation check(s) failed"
                  return 1
              fi

              echo "All bwrap validation checks passed"
          }

          main "$@"
          EOF

          chmod +x /tmp/check_bwrap_install.sh

      - name: End-to-end test of installing UnZip with EasyBuild in bwrap namespace
        shell: bash
        run: |
          bash -l <<EOF
            source /tmp/eb_env

            # make sure that --prefix also determines default value for bwrap-installpath
            eb --show-config --prefix /tmp | grep "bwrap-installpath [ ]* \(C\) = /tmp/bwrap"

            # test installation of UnZip + bzip2 dependency
            eb UnZip-6.0.eb --trace --robot --experimental --bwrap --bwrap-installpath /tmp/bwrap-installpath --filter-deps=binutils

            /tmp/check_bwrap_install.sh

          EOF

      - name: End-to-end test of installing UnZip with EasyBuild in bwrap namespace with overlay
        shell: bash
        run: |
          bash -l <<EOF
            cat /etc/os-release
            # bwrap version needs to be >=0.10 for --overlay and --overlay-src support
            bwrap --version

            source /tmp/eb_env

            # remove previously created install directories
            rm -r $HOME/.local/easybuild/{software,modules}/* /tmp/bwrap-installpath

            # make install directory read-only to force using overlay
            chmod -w $HOME/.local/easybuild/{software,modules}

            # test installation of UnZip + bzip2 dependency
            eb UnZip-6.0.eb --trace --robot --experimental --bwrap --bwrap-installpath /tmp/bwrap-installpath --filter-deps=binutils

            /tmp/check_bwrap_install.sh

          EOF
