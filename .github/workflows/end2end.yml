name: End-to-end test of EasyBuild in different distros
on: [push, pull_request]
jobs:
  build_publish:
    name: End-to-end test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container:
          - centos-8.5
          - fedora-41
          - opensuse-15.4
          - rockylinux-8.10
          - rockylinux-9.7
          - rockylinux-10.1
          - ubuntu-22.04
          - ubuntu-24.04
      fail-fast: false
    container:
      image: ghcr.io/easybuilders/${{ matrix.container }}-amd64
    steps:
      - name: Check out the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: download and unpack easyblocks and easyconfigs repositories
        run: |
          cd $HOME
          for pkg in easyblocks easyconfigs; do
              curl -OL https://github.com/easybuilders/easybuild-${pkg}/archive/develop.tar.gz
              tar xfz develop.tar.gz
              rm -f develop.tar.gz
          done

      - name: Set up environment
        shell: bash
        run: |
          # collect environment variables to be set in subsequent steps in script that can be sourced
          echo "export PATH=$PWD:$PATH" > /tmp/eb_env
          echo "export PYTHONPATH=$PWD:$HOME/easybuild-easyblocks-develop:$HOME/easybuild-easyconfigs-develop" >> /tmp/eb_env

      - name: Run commands to check test environment
        shell: bash
        run: |
          cmds=(
            "whoami"
            "pwd"
            "env | sort"
            "eb --version"
            "eb --show-system-info"
            "eb --check-eb-deps"
            "eb --show-config"
            "eb -x flex-2.6.4.eb"
          )
          for cmd in "${cmds[@]}"; do
              echo ">>> $cmd"
              sudo -u easybuild bash -l -c "source /tmp/eb_env; $cmd"
          done

      - name: End-to-end test of installing flex with EasyBuild
        shell: bash
        run: |
          sudo -u easybuild bash -l -c "source /tmp/eb_env; eb flex-2.6.4.eb --trace --robot"

      - name: Ensure `python3 -m venv` can be used
        if: startsWith(matrix.container, 'ubuntu')
        shell: bash
        run: |
          apt update && apt install -y python3-venv

      - name: Create a virtual environment and install EasyBuild with the click cli extra
        shell: bash
        run: |
          export VENVDIR=/home/easybuild/venv
          python3 -m venv $VENVDIR
          source $VENVDIR/bin/activate
          pip install --upgrade pip
          pip install .[eb_click]
          pip install $HOME/easybuild-easyblocks-develop
          pip install $HOME/easybuild-easyconfigs-develop
          chown -R easybuild $VENVDIR

      - name: Run commands to check test environment using the click cli
        shell: bash
        run: |
          export VENVDIR=/home/easybuild/venv
          cmds=(
            "whoami"
            "pwd"
            "env | sort"
            "eb --help"
            "eb --version"
            "eb --help | grep '─ Options ─'"
            "eb --show-system-info"
            "eb --check-eb-deps"
            "eb --show-config"
            "eb -x bzip2-1.0.8.eb"
          )
          for cmd in "${cmds[@]}"; do
              echo ">>> $cmd"
              sudo -u easybuild bash -l -c "export EB_CLI_CLICK=1; source $VENVDIR/bin/activate; $cmd"
          done

      - name: End-to-end test of installing flex with EasyBuild using the click cli
        shell: bash
        run: |
          export VENVDIR=/home/easybuild/venv
          sudo -u easybuild bash -l -c "export EB_CLI_CLICK=1; source $VENVDIR/bin/activate; eb flex-2.6.4.eb --rebuild --trace --robot"
